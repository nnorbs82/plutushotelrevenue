name: Export redesign source

on:
  push:
    branches:
      - plutus-redesign
    paths:
      - '.github/workflows/export-redesign-source.yml'

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Check out redesign branch
        uses: actions/checkout@v4
        with:
          ref: plutus-redesign
      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: plutus-redesign-source
          path: .
          include-hidden-files: true
          retention-days: 1
