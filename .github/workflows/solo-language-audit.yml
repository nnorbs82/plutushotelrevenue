name: Audit solo-business language
on:
  push:
    branches: [plutus-v4-real-preview]
    paths: ['.github/workflows/solo-language-audit.yml']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: plutus-v4-real-preview
      - name: Find plural agency language
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          pat = re.compile(r'\b(we|we\x27re|we\x27ll|we\x27ve|our|ours|us|team|teams)\b', re.I)
          found = False
          for path in sorted(list(Path('.').glob('*.html')) + [Path('navigation.js')]):
              text = path.read_text(encoding='utf-8')
              for n,line in enumerate(text.splitlines(),1):
                  if pat.search(line):
                      found=True
                      print(f'{path}:{n}: {line.strip()}')
          if found:
              raise SystemExit(1)
          print('No plural agency language found.')
          PY
