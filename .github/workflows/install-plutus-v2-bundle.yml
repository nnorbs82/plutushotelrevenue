name: Install final Plutus charcoal gold redesign

on:
  push:
    branches:
      - plutus-redesign
    paths:
      - '.github/workflows/install-plutus-v2-bundle.yml'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Check out redesign branch
        uses: actions/checkout@v4
        with:
          ref: plutus-redesign
          fetch-depth: 0

      - name: Expand final reviewed redesign bundle
        run: |
          cat .redesign-v2/bundle.part.* > /tmp/plutus-v2.b64
          base64 -d /tmp/plutus-v2.b64 > /tmp/plutus-v2.tar.xz
          tar -tJf /tmp/plutus-v2.tar.xz
          tar -xJf /tmp/plutus-v2.tar.xz -C .

      - name: Validate revised website
        run: |
          python tools/validate_site.py
          node --check navigation.js
          node --check calculator.js

      - name: Commit final redesign and clean staging files
        run: |
          rm -rf .redesign .redesign-v2
          rm -f .github/workflows/apply-plutus-v2.yml
          rm -f .github/workflows/export-plutus-assets.yml
          rm -f .github/workflows/export-plutus-repo.yml
          rm -f .github/workflows/export-redesign-source.yml
          rm -f .github/workflows/install-plutus-v2-bundle.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: rebuild Plutus around charcoal and gold brand system"
          git push origin HEAD:plutus-redesign
