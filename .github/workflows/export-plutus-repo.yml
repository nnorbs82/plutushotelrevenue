name: Export Plutus redesign source

on:
  push:
    branches:
      - plutus-redesign
    paths:
      - '.github/workflows/export-plutus-repo.yml'

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: plutus-redesign
      - uses: actions/upload-artifact@v4
        with:
          name: plutus-redesign-source
          path: .
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
