name: Install Plutus redesign

on:
  push:
    branches:
      - plutus-redesign
    paths:
      - '.github/workflows/install-plutus-redesign.yml'

permissions:
  contents: write

jobs:
  install:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out redesign branch
        uses: actions/checkout@v4
        with:
          ref: plutus-redesign
          fetch-depth: 0

      - name: Expand reviewed redesign bundle
        shell: bash
        run: |
          cat .redesign/bundle.part.* | base64 --decode > /tmp/plutus-redesign.tar.xz
          tar -xJf /tmp/plutus-redesign.tar.xz -C .
          rm -rf .redesign
          rm -f .github/workflows/install-plutus-redesign.yml

      - name: Validate generated website
        run: |
          python tools/validate_site.py
          node --check navigation.js
          node --check calculator.js
          node - <<'NODE_TEST'
          const { calculateModel } = require('./calculator.js');
          const result = calculateModel({
            currency: 'EUR', rooms: 66, days: 30, outOfOrder: 0, currentOccupancy: 68,
            targetProfit: 10000, adr: 135, ancillaryRevenue: 18, otaShare: 55,
            otaCommission: 17, paymentFee: 1.5, revenueFee: 0, housekeeping: 8,
            linen: 3.5, amenities: 1.5, variableUtilities: 3.7, breakfastCost: 7,
            otherVariable: 1.3, payroll: 65000, rent: 18000, fixedUtilities: 7500,
            insurance: 5000, technology: 3500, maintenance: 4500, salesAdmin: 5500,
            otherFixed: 3000
          });
          if (!result.valid || Math.abs(result.breakEvenOccupancy - 50.0215829732) > 1e-8) {
            throw new Error('Calculator regression test failed');
          }
          NODE_TEST

      - name: Commit redesign
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: redesign Plutus website and add hotel break-even calculator"
          git push origin HEAD:plutus-redesign
