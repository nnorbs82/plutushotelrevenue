name: Build Plutus blog

on:
  push:
    paths:
      - 'content/blog/**'
      - 'blog/media/**'
      - 'tools/build_blog.py'
      - '.pages.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build archive and article pages
        run: python tools/build_blog.py
      - name: Commit generated pages
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add blog.html blog-*.html index.html sitemap.xml
          if git diff --cached --quiet; then
            echo 'No generated changes.'
          else
            git commit -m 'build: regenerate Plutus blog'
            git push
          fi
