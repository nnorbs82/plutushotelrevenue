name: Apply balanced Plutus visual layer

on:
  push:
    branches:
      - plutus-redesign
    paths:
      - '.github/workflows/apply-plutus-v3.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out redesign branch
        uses: actions/checkout@v4
        with:
          ref: plutus-redesign
          fetch-depth: 0

      - name: Add v3 stylesheet to all pages
        run: |
          python - <<'PY'
          from pathlib import Path

          marker = '<link rel="stylesheet" href="plutus-v2.css?v=20260902b">'
          addition = marker + '\n  <link rel="stylesheet" href="plutus-v3.css?v=20260902c">'
          for path in Path('.').glob('*.html'):
              text = path.read_text(encoding='utf-8')
              if 'plutus-v3.css' not in text and marker in text:
                  path.write_text(text.replace(marker, addition), encoding='utf-8')
          PY

      - name: Validate and commit
        run: |
          test -s plutus-v3.css
          node --check navigation.js
          node --check calculator.js
          rm -f .github/workflows/apply-plutus-v3.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: balance Plutus identity and improve readability"
          git push origin HEAD:plutus-redesign
