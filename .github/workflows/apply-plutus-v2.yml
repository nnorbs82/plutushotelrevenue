name: Apply Plutus charcoal gold redesign

on:
  push:
    branches:
      - plutus-redesign
    paths:
      - '.github/workflows/apply-plutus-v2.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out redesign branch
        uses: actions/checkout@v4
        with:
          ref: plutus-redesign
          fetch-depth: 0

      - name: Apply revised design patch
        run: |
          cat .redesign/v2patch.part.* > /tmp/v2patch.b64
          base64 -d /tmp/v2patch.b64 > /tmp/v2.patch
          git apply --check /tmp/v2.patch
          git apply /tmp/v2.patch

      - name: Validate revised website
        run: |
          python tools/validate_site.py
          node --check navigation.js
          node --check calculator.js

      - name: Clean temporary files and commit
        run: |
          rm -rf .redesign
          rm -f .github/workflows/export-plutus-assets.yml
          rm -f .github/workflows/export-plutus-repo.yml
          rm -f .github/workflows/apply-plutus-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: rebuild Plutus in charcoal gold editorial direction"
          git push origin HEAD:plutus-redesign
