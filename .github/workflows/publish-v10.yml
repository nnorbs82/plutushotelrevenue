name: Publish Plutus V10 welcoming modern redesign
# Final publication - workflow file added separately after validated site commit

on:
  push:
    branches:
      - plutus-v10-welcoming-modern
    paths:
      - '.github/workflows/publish-v10.yml'

permissions:
  contents: write

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: plutus-v10-welcoming-modern
          fetch-depth: 0

      - name: Verify exact V10 bundle
        run: |
          echo '762fcb7e0b8ef872545994af5a9f5cad0a919639f2cd446e9c2e923e3b338196  .v10/part00' | sha256sum -c -
          echo '66fa3eaed225123d05bd62b8367ccdcfb2922564dcd50c50b5aca5b18956e6ef  .v10/part01' | sha256sum -c -
          echo 'de072bdc25ab364b276f85a0dee72e903c93c3dae92006c6912e236c460e0217  .v10/part02' | sha256sum -c -
          echo '3c141b164c51b9c8ec32e88f07384ca410ac7ee2956f79945ff04dc983f0aa6d  .v10/part03' | sha256sum -c -
          echo '901876ca7348fcea937f112e7440363814d0408b3dfb4b9ea27f6da755c4d672  .v10/part04' | sha256sum -c -
          echo '075a8aece413070b4bd8cebedf0036caeefbe9fe21f7370c0aa15f4a913550b8  .v10/part05' | sha256sum -c -
          echo 'dccc2bb0fbc647e1acc78640919fa607a8637128271736d43764ba9a00463a3c  .v10/part06' | sha256sum -c -
          echo '93c77323680106fc73a17f73370dd75831e8c578245edfdc65ad3d487a50931c  .v10/part07' | sha256sum -c -
          echo '46065114e1769299494a564fc00cb1e66609590c0b24277ca604aea609ec2e0d  .v10/part08' | sha256sum -c -
          echo '9feb048871c4c1ac2247cec877bb68245bbbdf1229f3ff8518680b08d5018cc9  .v10/part09' | sha256sum -c -
          echo '1076510a3c07588c599e82e635ee20833e61c4c112e6ec23be59db9b74981f59  .v10/part10' | sha256sum -c -
          cat .v10/part00 .v10/part01 .v10/part02 .v10/part03 .v10/part04 .v10/part05 .v10/part06 .v10/part07 .v10/part08 .v10/part09 .v10/part10 > /tmp/plutus-v10.b64
          test "$(wc -c < /tmp/plutus-v10.b64)" -eq 64192
          base64 -d /tmp/plutus-v10.b64 > /tmp/plutus-v10.tgz
          echo 'bbd1e5264bd345766d77f8f5ba5d383f316255bc60e6515459c32a5f76721787  /tmp/plutus-v10.tgz' | sha256sum -c -
          tar -xzf /tmp/plutus-v10.tgz

      - name: Validate site, Tips, Blog CMS and calculator
        run: |
          python - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          from urllib.parse import urlsplit
          import re

          core_pages = [
            'index.html','about.html','revenue_management.html','software.html','mews_pms.html',
            'cloudbeds_pms.html','siteminder_chm.html','tips.html','hotel_photoshoot_tips.html',
            'web_design_tips.html','digital_marketing_tips.html','hotel-break-even-calculator.html',
            'blog.html','contact.html','privacy_policy.html','terms_and_conditions.html','404.html','admin.html'
          ]
          blog_pages = sorted(p.name for p in Path('.').glob('blog-*.html'))
          pages = core_pages + blog_pages
          known_assets = {
            'logo/logo.png','about/profile_photo.png','about/about_background.jpg',
            'index/heroback.webp','index/orv.webp','index/tai.webp','index/marketback.webp','index/si.webp',
            'softwareinformation/mews logo.png','softwareinformation/cloudbeds logo.jpg','softwareinformation/siteminder logo.png'
          }
          errors=[]
          class Parser(HTMLParser):
            def __init__(self): super().__init__(); self.refs=[]; self.h1=0
            def handle_starttag(self,tag,attrs):
              d=dict(attrs)
              if tag=='h1': self.h1 += 1
              for key in ('href','src'):
                if key in d: self.refs.append(d[key])

          for name in pages:
            p=Path(name)
            if not p.exists(): errors.append(f'missing {name}'); continue
            text=p.read_text(encoding='utf-8')
            if 'v10.css' not in text or 'v10.js' not in text: errors.append(f'{name}: missing V10 assets')
            if 'data-v10-header' not in text or 'data-v10-footer' not in text: errors.append(f'{name}: missing shared shell')
            if re.search(r'Field\s+notes?', text, re.I): errors.append(f'{name}: old Field Notes wording remains')
            parser=Parser(); parser.feed(text)
            if parser.h1 != 1: errors.append(f'{name}: expected one H1, found {parser.h1}')
            if name not in {'privacy_policy.html','terms_and_conditions.html','404.html','admin.html'}:
              m=re.search(r"\b(we|we're|we've|we'll|our|ours|us)\b", text, re.I)
              if m: errors.append(f'{name}: agency-style plural voice {m.group(0)!r}')
            for ref in parser.refs:
              if not ref or ref.startswith('#'): continue
              u=urlsplit(ref)
              if u.scheme or u.netloc: continue
              path=u.path
              if not path: continue
              if path in known_assets: continue
              if path.startswith('blog/media/') and Path(path).exists(): continue
              if not Path(path).exists(): errors.append(f'{name}: broken local ref {ref}')

          if len(blog_pages) < 4: errors.append(f'expected at least 4 generated blog pages, found {len(blog_pages)}')
          for required in ['content/blog','.pages.yml','tools/build_blog.py','.github/workflows/build-blog.yml']:
            if not Path(required).exists(): errors.append(f'missing Blog/CMS component {required}')

          tips_checks = {
            'hotel_photoshoot_tips.html':['Scout the location','atmosphere','equipment','natural and artificial light','visual story','composition','amenities','editing','after dark','RAW','usage rights'],
            'web_design_tips.html':['User experience','Visual','booking','Social proof','SEO','Security','content','technology'],
            'digital_marketing_tips.html':['SEO','communication','customer experience','cost','measure','Social','Email','paid']
          }
          for page, needles in tips_checks.items():
            text=Path(page).read_text(encoding='utf-8').lower()
            for needle in needles:
              if needle.lower() not in text: errors.append(f'{page}: missing detailed advice topic {needle!r}')

          software_checks={
            'mews_pms.html':['softwareinformation/mews logo.png','15,000+','1,000+'],
            'cloudbeds_pms.html':['softwareinformation/cloudbeds logo.jpg','300+'],
            'siteminder_chm.html':['softwareinformation/siteminder logo.png','450+','350+']
          }
          for page,needles in software_checks.items():
            text=Path(page).read_text(encoding='utf-8')
            for needle in needles:
              if needle not in text: errors.append(f'{page}: missing vendor content {needle!r}')

          about=Path('about.html').read_text(encoding='utf-8')
          css=Path('v10.css').read_text(encoding='utf-8')
          if 'about/profile_photo.png' not in about: errors.append('about.html: original profile photo missing')
          if 'filter:none' not in css.replace(' ','').lower(): errors.append('v10.css: explicit unfiltered portrait rule missing')
          if css.count('{') != css.count('}'): errors.append('v10.css: unbalanced braces')
          sizes=[float(x) for x in re.findall(r'font-size\s*:\s*([0-9.]+)px',css,re.I)]
          if sizes and min(sizes) < 14: errors.append(f'v10.css: font size below 14px found ({min(sizes)}px)')

          js=Path('v10.js').read_text(encoding='utf-8')
          for needle in ['pointermove','signal-plane','--mx','--my']:
            if needle not in js: errors.append(f'v10.js: restored hero motion missing {needle!r}')

          pages_cfg=Path('.pages.yml').read_text(encoding='utf-8') if Path('.pages.yml').exists() else ''
          for needle in ['content/blog','yaml-frontmatter','rich-text','blog/media']:
            if needle not in pages_cfg: errors.append(f'.pages.yml: missing {needle!r}')

          if errors: raise SystemExit('\n'.join(errors))
          print('Static V10 validation passed for',len(pages),'HTML pages')
          print('Minimum explicit font size:',min(sizes) if sizes else 'n/a')
          PY

          node --check v10.js
          node --check calculator-v10-core.js
          node --check calculator-v10.js
          node - <<'NODE'
          const c=require('./calculator-v10-core.js');
          let m=c.calculate({rooms:50,days:30,adr:120,variableCost:22,fixedCost:70000});
          if(!m.valid) throw new Error(JSON.stringify(m.errors));
          if(Math.abs(m.contribution-98)>1e-6) throw new Error('Contribution regression');
          if(Math.abs(m.beOcc-47.619047619)>0.001) throw new Error('Break-even regression');
          if(m.currentProfit!==null) throw new Error('Blank occupancy should not project profit');
          m=c.calculate({rooms:50,days:30,adr:120,variableCost:22,fixedCost:70000,currentOccupancy:65});
          if(Math.abs(m.currentProfit-25550)>1e-6) throw new Error('Scenario profit regression');
          console.log('Calculator regression passed:',m.beOcc.toFixed(2)+'%');
          NODE

          python - <<'PY'
          from pathlib import Path
          import hashlib, subprocess
          targets=[Path('blog.html'),Path('index.html'),Path('sitemap.xml'),*sorted(Path('.').glob('blog-*.html'))]
          def digest(p): return hashlib.sha256(p.read_bytes()).hexdigest()
          before={str(p):digest(p) for p in targets}
          subprocess.run(['python','tools/build_blog.py'],check=True)
          after={str(p):digest(p) for p in targets}
          if before != after:
            changed=[k for k in before if before[k]!=after.get(k)]
            raise SystemExit('Blog builder is not reproducible; changed: '+', '.join(changed))
          print('Blog generator reproducibility passed for',len(targets),'generated files')
          PY

      - name: Commit validated V10 site
        run: |
          rm -rf .v10
          rm -f .github/workflows/build-blog.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'design: build welcoming ultra-modern Plutus V10 with full Tips and blog CMS'
          git push origin HEAD:plutus-v10-welcoming-modern
