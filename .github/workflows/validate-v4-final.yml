name: Validate Plutus v4 final
on:
  push:
    branches: [plutus-v4-real-preview]
    paths: ['.github/workflows/validate-v4-final.yml']
permissions:
  contents: write
jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: plutus-v4-real-preview
          fetch-depth: 0
      - name: Validate website
        run: |
          python tools/validate_site.py
          node --check navigation.js
          node --check calculator.js
          grep -q 'plutus-v4-extra.css' plutus-v4.css
          node - <<'NODE'
          const calc = require('./calculator.js');
          const model = calc.calculateModel({currency:'EUR',rooms:50,days:30,adr:120,variableCost:22,fixedCost:70000,currentOccupancy:65,targetProfit:0,ancillaryRevenue:0,otaShare:0,otaCommission:15,paymentFee:0});
          if (!model.valid) throw new Error(JSON.stringify(model.errors));
          if (Math.abs(model.breakEvenOccupancy - 47.619047619) > 0.001) throw new Error('Unexpected break-even occupancy');
          if (Math.abs(model.contributionPerOccupiedRoom - 98) > 0.001) throw new Error('Unexpected contribution');
          console.log('V4 calculator regression OK', model.breakEvenOccupancy.toFixed(2));
          NODE
          python - <<'PY'
          from pathlib import Path
          import re
          pat=re.compile(r'\b(we|we\x27re|we\x27ll|we\x27ve|our|ours|us)\b',re.I)
          hits=[]
          for path in sorted(list(Path('.').glob('*.html'))+[Path('navigation.js')]):
              for n,line in enumerate(path.read_text(encoding='utf-8').splitlines(),1):
                  if pat.search(line): hits.append(f'{path}:{n}: {line.strip()}')
          if hits:
              print('\n'.join(hits)); raise SystemExit(1)
          print('V4 solo-copy audit OK')
          PY
      - name: Clean validation workflow
        run: |
          rm -f .github/workflows/validate-v4-final.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: remove final v4 validation workflow"
          git push origin HEAD:plutus-v4-real-preview
