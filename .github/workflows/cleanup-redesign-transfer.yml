name: Clean redesign transfer files

on:
  push:
    branches:
      - plutus-redesign
    paths:
      - '.github/workflows/cleanup-redesign-transfer.yml'

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - name: Check out redesign branch
        uses: actions/checkout@v4
        with:
          ref: plutus-redesign
          fetch-depth: 0

      - name: Remove transfer-only files
        run: |
          rm -rf .redesign .redesign-v2
          rm -f .github/workflows/apply-plutus-v2.yml
          rm -f .github/workflows/export-plutus-assets.yml
          rm -f .github/workflows/export-plutus-repo.yml
          rm -f .github/workflows/cleanup-redesign-transfer.yml

      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: remove temporary redesign transfer files"
          git push origin HEAD:plutus-redesign
