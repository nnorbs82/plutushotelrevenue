name: Apply Plutus V8 hypermodern redesign

on:
  push:
    branches:
      - plutus-v8-hypermodern
    paths:
      - '.github/workflows/apply-v8-hypermodern.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: plutus-v8-hypermodern
          fetch-depth: 0

      - name: Verify and extract complete redesign bundle
        run: |
          base64 -d .v8-bundle.b64 > /tmp/plutus-v8.tgz
          echo 'd856ceb47fbb8e7ee6929056764bd769cf2b90bc5a30dda2ac39b8c6068d07df  /tmp/plutus-v8.tgz' | sha256sum -c -
          tar -xzf /tmp/plutus-v8.tgz

      - name: Validate static site
        run: |
          python - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          from urllib.parse import urlsplit
          import re

          pages = [
            'index.html','about.html','revenue_management.html','software.html','mews_pms.html',
            'cloudbeds_pms.html','siteminder_chm.html','tips.html','hotel_photoshoot_tips.html',
            'web_design_tips.html','digital_marketing_tips.html','hotel-break-even-calculator.html',
            'blog.html','contact.html','privacy_policy.html','terms_and_conditions.html','404.html','admin.html'
          ]
          known_assets = {
            'logo/logo.png','about/profile_photo.png','index/heroback.webp','index/orv.webp',
            'index/tai.webp','index/marketback.webp','index/si.webp'
          }
          errors=[]
          class Parser(HTMLParser):
            def __init__(self):
              super().__init__(); self.refs=[]; self.h1=0
            def handle_starttag(self,tag,attrs):
              d=dict(attrs)
              if tag=='h1': self.h1 += 1
              for k in ('href','src'):
                if k in d: self.refs.append(d[k])
          for name in pages:
            p=Path(name)
            if not p.exists(): errors.append(f'missing {name}'); continue
            text=p.read_text(encoding='utf-8')
            if 'v8.css' not in text or 'v8.js' not in text: errors.append(f'{name}: missing V8 assets')
            if 'data-v8-header' not in text or 'data-v8-footer' not in text: errors.append(f'{name}: missing shared shell targets')
            parser=Parser(); parser.feed(text)
            if parser.h1 != 1: errors.append(f'{name}: expected one H1, found {parser.h1}')
            if name not in {'privacy_policy.html','terms_and_conditions.html','404.html','admin.html'}:
              m=re.search(r"\b(we|we're|we've|we'll|our|ours|us)\b", text, re.I)
              if m: errors.append(f'{name}: agency-style plural voice {m.group(0)!r}')
            for ref in parser.refs:
              if not ref or ref.startswith('#'): continue
              u=urlsplit(ref)
              if u.scheme or u.netloc: continue
              path=u.path
              if path in known_assets: continue
              if path and not Path(path).exists(): errors.append(f'{name}: broken local ref {ref}')
          css=Path('v8.css').read_text(encoding='utf-8')
          if css.count('{') != css.count('}'): errors.append('v8.css: unbalanced braces')
          if errors: raise SystemExit('\n'.join(errors))
          print('Static V8 validation passed for', len(pages), 'pages')
          PY
          node --check v8.js
          node --check calculator-v8-core.js
          node --check calculator-v8.js
          node - <<'NODE'
          const c=require('./calculator-v8-core.js');
          let m=c.calculate({rooms:50,days:30,adr:120,variableCost:22,fixedCost:70000});
          if(!m.valid) throw new Error(JSON.stringify(m.errors));
          if(Math.abs(m.contribution-98)>1e-6) throw new Error('Contribution regression');
          if(Math.abs(m.beOcc-47.619047619)>0.001) throw new Error('Break-even regression');
          if(m.currentProfit!==null) throw new Error('Blank occupancy should not project profit');
          m=c.calculate({rooms:50,days:30,adr:120,variableCost:22,fixedCost:70000,currentOccupancy:65});
          if(Math.abs(m.currentProfit-25550)>1e-6) throw new Error('Scenario profit regression');
          console.log('Calculator regression passed:', m.beOcc.toFixed(2)+'%');
          NODE

      - name: Commit clean V8 branch
        run: |
          rm -f .v8-bundle.b64 .github/workflows/apply-v8-hypermodern.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'design: rebuild Plutus as hypermodern revenue brand'
          git push origin HEAD:plutus-v8-hypermodern
