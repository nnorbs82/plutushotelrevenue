name: Publish Plutus V8 hypermodern redesign

on:
  push:
    branches:
      - plutus-v8-hypermodern
    paths:
      - '.github/workflows/apply-v8-final.yml'

permissions:
  contents: write

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: plutus-v8-hypermodern
          fetch-depth: 0

      - name: Verify staged redesign
        run: |
          echo 'ed56f7951e0e569403bfd3771fd4aa6a1cde3b8d5fd0f7cf442caea078b97fe7  .v8/part00' | sha256sum -c -
          echo '44c2c31c43dbc5bf6260b0a0b5483bf6dfbf8bab27cb1c36d273a5075fd32607  .v8/part01' | sha256sum -c -
          echo '00f6c54e66ae66be5c4b3aab4656c66b8cbab28c91228c44e855236b5833c645  .v8/part02' | sha256sum -c -
          echo '6f895943fd5bb9cd9033d9aece518c52b27961a302847620537ef77a31e62898  .v8/part03' | sha256sum -c -
          echo '19cfd8975633b35a6643bfa027f13cea553e1c231ff73c02fdc795da9dc75bf7  .v8/part04' | sha256sum -c -
          cat .v8/part00 .v8/part01 .v8/part02 .v8/part03 .v8/part04 > /tmp/plutus-v8.b64
          test "$(wc -c < /tmp/plutus-v8.b64)" -eq 33544
          base64 -d /tmp/plutus-v8.b64 > /tmp/plutus-v8.tgz
          echo 'd856ceb47fbb8e7ee6929056764bd769cf2b90bc5a30dda2ac39b8c6068d07df  /tmp/plutus-v8.tgz' | sha256sum -c -
          tar -xzf /tmp/plutus-v8.tgz

      - name: Validate complete redesign
        run: |
          python - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          from urllib.parse import urlsplit
          import re
          pages=['index.html','about.html','revenue_management.html','software.html','mews_pms.html','cloudbeds_pms.html','siteminder_chm.html','tips.html','hotel_photoshoot_tips.html','web_design_tips.html','digital_marketing_tips.html','hotel-break-even-calculator.html','blog.html','contact.html','privacy_policy.html','terms_and_conditions.html','404.html','admin.html']
          assets={'logo/logo.png','about/profile_photo.png','index/heroback.webp','index/orv.webp','index/tai.webp','index/marketback.webp','index/si.webp'}
          errors=[]
          class P(HTMLParser):
            def __init__(self): super().__init__(); self.refs=[]; self.h1=0
            def handle_starttag(self,t,a):
              d=dict(a); self.h1 += (t=='h1')
              self.refs += [d[k] for k in ('href','src') if k in d]
          for name in pages:
            p=Path(name)
            if not p.exists(): errors.append('missing '+name); continue
            text=p.read_text(encoding='utf-8')
            if 'v8.css' not in text or 'v8.js' not in text: errors.append(name+': missing V8 assets')
            if 'data-v8-header' not in text or 'data-v8-footer' not in text: errors.append(name+': missing shell')
            q=P(); q.feed(text)
            if q.h1 != 1: errors.append(f'{name}: H1 count {q.h1}')
            if name not in {'privacy_policy.html','terms_and_conditions.html','404.html','admin.html'}:
              m=re.search(r"\b(we|we're|we've|we'll|our|ours|us)\b",text,re.I)
              if m: errors.append(f'{name}: plural agency voice {m.group(0)!r}')
            for ref in q.refs:
              if not ref or ref.startswith('#'): continue
              u=urlsplit(ref)
              if u.scheme or u.netloc: continue
              if u.path in assets: continue
              if u.path and not Path(u.path).exists(): errors.append(f'{name}: broken {ref}')
          css=Path('v8.css').read_text(encoding='utf-8')
          if css.count('{')!=css.count('}'): errors.append('unbalanced CSS')
          if errors: raise SystemExit('\n'.join(errors))
          print(f'Static validation passed for {len(pages)} pages')
          PY
          node --check v8.js
          node --check calculator-v8-core.js
          node --check calculator-v8.js
          node - <<'NODE'
          const c=require('./calculator-v8-core.js');
          let m=c.calculate({rooms:50,days:30,adr:120,variableCost:22,fixedCost:70000});
          if(!m.valid || Math.abs(m.contribution-98)>1e-6 || Math.abs(m.beOcc-47.619047619)>0.001 || m.currentProfit!==null) throw new Error('Core regression failed');
          m=c.calculate({rooms:50,days:30,adr:120,variableCost:22,fixedCost:70000,currentOccupancy:65});
          if(Math.abs(m.currentProfit-25550)>1e-6) throw new Error('Scenario regression failed');
          console.log('Calculator regression passed:',m.beOcc.toFixed(2)+'%');
          NODE

      - name: Commit clean review branch
        run: |
          rm -rf .v8 .v8-bundle.b64 .github/workflows/apply-v8-hypermodern.yml .github/workflows/apply-v8-final.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'design: rebuild Plutus as hypermodern revenue brand'
          git push origin HEAD:plutus-v8-hypermodern
