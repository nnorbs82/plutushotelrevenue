name: Install revised Plutus redesign

on:
  push:
    branches:
      - plutus-redesign
    paths:
      - '.github/workflows/install-plutus-v2.yml'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Check out redesign branch
        uses: actions/checkout@v4
        with:
          ref: plutus-redesign
          fetch-depth: 0

      - name: Expand revised redesign bundle
        run: |
          cat .redesign-v2/bundle.part.* | base64 --decode > /tmp/plutus-v2.tar.xz
          tar -xJf /tmp/plutus-v2.tar.xz -C .
          rm -rf .redesign-v2
          rm -f .github/workflows/export-redesign-source.yml
          rm -f .github/workflows/install-plutus-v2.yml

      - name: Validate website
        run: |
          python tools/validate_site.py
          node --check navigation.js
          node --check calculator.js

      - name: Commit revised design
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: realign Plutus redesign with original navy and gold identity"
          git push origin HEAD:plutus-redesign
