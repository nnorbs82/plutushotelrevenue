<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="t d"><title id="t">Hotel digital marketing net value visual</title><desc id="d">A dark visual map of hotel demand channels converging into net commercial value.</desc><defs><radialGradient id="glow" cx="50%" cy="50%" r="50%"><stop stop-color="#c8c2ff" stop-opacity=".24"/><stop offset="1" stop-color="#c8c2ff" stop-opacity="0"/></radialGradient><linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#a9e9ff" stop-opacity=".15"/><stop offset=".5" stop-color="#d9ff4a"/><stop offset="1" stop-color="#c8c2ff" stop-opacity=".2"/></linearGradient></defs><rect width="1600" height="1000" fill="#08090b"/><circle cx="820" cy="500" r="430" fill="url(#glow)"/><g fill="none" stroke="#fff" stroke-opacity=".1"><circle cx="820" cy="500" r="340"/><circle cx="820" cy="500" r="245"/><circle cx="820" cy="500" r="150"/><path d="M130 500H1470M820 80V920"/></g><g stroke="url(#line)" stroke-width="4" fill="none" stroke-linecap="round"><path d="M250 180C470 205 520 315 650 408"/><path d="M235 500C430 500 520 500 650 500"/><path d="M300 812C480 770 540 675 662 592"/><path d="M1370 210C1160 245 1100 325 985 415"/><path d="M1390 510C1180 510 1100 505 990 505"/><path d="M1335 815C1160 760 1100 675 982 590"/></g><g font-family="Arial,Helvetica,sans-serif"><g transform="translate(180 115)"><rect width="260" height="112" rx="20" fill="#10141a" stroke="#a9e9ff" stroke-opacity=".3"/><text x="26" y="36" fill="#a9e9ff" font-size="14" letter-spacing="3">SEARCH</text><text x="26" y="78" fill="#fff" font-size="31" font-weight="700">2.8x ROAS</text></g><g transform="translate(145 444)"><rect width="270" height="112" rx="20" fill="#10141a" stroke="#c8c2ff" stroke-opacity=".3"/><text x="26" y="36" fill="#c8c2ff" font-size="14" letter-spacing="3">SOCIAL</text><text x="26" y="78" fill="#fff" font-size="31" font-weight="700">+42% REACH</text></g><g transform="translate(225 755)"><rect width="280" height="112" rx="20" fill="#10141a" stroke="#d9ff4a" stroke-opacity=".3"/><text x="26" y="36" fill="#d9ff4a" font-size="14" letter-spacing="3">EMAIL / CRM</text><text x="26" y="78" fill="#fff" font-size="31" font-weight="700">€11.8K</text></g><g transform="translate(1190 140)"><rect width="250" height="112" rx="20" fill="#10141a" stroke="#ff9a7f" stroke-opacity=".3"/><text x="26" y="36" fill="#ff9a7f" font-size="14" letter-spacing="3">PAID MEDIA</text><text x="26" y="78" fill="#fff" font-size="31" font-weight="700">8.2% CAC</text></g><g transform="translate(1210 450)"><rect width="260" height="112" rx="20" fill="#10141a" stroke="#a9e9ff" stroke-opacity=".3"/><text x="26" y="36" fill="#a9e9ff" font-size="14" letter-spacing="3">DIRECT</text><text x="26" y="78" fill="#fff" font-size="31" font-weight="700">31% SHARE</text></g><g transform="translate(1160 770)"><rect width="300" height="112" rx="20" fill="#10141a" stroke="#c8c2ff" stroke-opacity=".3"/><text x="26" y="36" fill="#c8c2ff" font-size="14" letter-spacing="3">OTA COST</text><text x="26" y="78" fill="#fff" font-size="31" font-weight="700">16.4%</text></g></g><circle cx="820" cy="500" r="122" fill="#11151b" stroke="#d9ff4a" stroke-width="4"/><circle cx="820" cy="500" r="86" fill="#d9ff4a" opacity=".08"/><text x="820" y="475" text-anchor="middle" fill="#d9ff4a" font-family="Arial" font-size="28" font-weight="700" letter-spacing="3">NET</text><text x="820" y="520" text-anchor="middle" fill="#fff" font-family="Arial" font-size="31" font-weight="700">COMMERCIAL</text><text x="820" y="557" text-anchor="middle" fill="#fff" font-family="Arial" font-size="31" font-weight="700">VALUE</text><text x="120" y="920" fill="#fff" opacity=".55" font-family="Arial" font-size="18" letter-spacing="4">ATTENTION → DEMAND → CONVERSION → COST → NET VALUE</text><text x="120" y="875" fill="#fff" font-family="Arial" font-size="34" font-weight="700">THE CLICK IS NOT THE RESULT.</text></svg>